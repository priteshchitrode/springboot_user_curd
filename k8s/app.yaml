apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-user-curd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-user-curd
  template:
    metadata:
      labels:
        app: springboot-user-curd
    spec:
      containers:
        - name: springboot-user-curd
          image: priteshchitrode/springboot_user_curd:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/springboot_crud
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234567890"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: com.mysql.cj.jdbc.Driver
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_SHOW_SQL
              value: "true"

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-user-curd-service
spec:
  type: NodePort
  selector:
    app: springboot-user-curd
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080